[package]
name = "pathallele"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Source-resolved haploid variants from pangenome graph paths"
repository = "https://github.com/hhuili/PathAllele"
include = ["src/**", "native/**", "tests/**", "examples/demo/**", "environments/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "THIRD_PARTY.md", "CHANGELOG.md", "CITATION.cff", "pathallele.1"]

[dependencies]
clap = { version = "=4.5.51", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
flate2 = "=1.1.5"
csv = "=1.3.1"
sha2 = "0.10"
bincode = "1.3"
memmap2 = "=0.9.9"
rayon = "=1.10.0"

num-bigint = "=0.4.6"
num-traits = "=0.2.19"
libc = "=0.2.177"
fs2 = "0.4"
noodles-vcf = "=0.73.0"
# Keep the supported Rust 1.82 toolchain across transitive parser updates.
indexmap = "=2.7.1"
noodles-bgzf = "=0.35.0"

[profile.release]
lto = "thin"
codegen-units = 1
