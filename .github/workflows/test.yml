name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build ruff
      - run: ruff check --select F src tests examples
      - run: python -m unittest discover -s tests -v
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/calling.yml
          cache-environment: true
      - shell: bash -el {0}
        run: |
          python -m pip install .
          bash environments/build_native.sh
          PATHALLELE_ALIGNER="$PWD/tools/pathallele-align" python -m unittest discover -s tests -v
